{% extends "servicebase.html" %}

{% block content %}

<div style="display:flex;height:95vh;">

    <!-- Map -->
    <div style="flex:4;">
        <iframe
            src="{{ url_for('cruiseService.generated_file',
                             filename=map_file) }}"
            width="100%"
            height="100%"
            frameborder="0">
        </iframe>
    </div>

    <!-- Table -->
    <div style="
            flex:1;
            height:100%;
            overflow-y:auto;
            border-left:1px solid #ccc;
            padding:10px;
        ">

        <h3>{{ cruise_name }}</h3>

        <table style="
                width:100%;
                border-collapse:collapse;
                font-size:12px;
            ">

            <thead style="
                    position:sticky;
                    top:0;
                    background:white;
                ">

                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Port</th>
                    <th>Country</th>
                    <th>V</th>
                </tr>

            </thead>

            <tbody>

                {% for p in itinerary %}

                <tr>
                    <td>{{ p.seq }}</td>
                    <td>{{ p.date }}</td>
                    <td>{{ p.port }}</td>
                    <td>{{ p.country }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
