{% extends "servicebase.html" %}

{% block content %}

<h1>🎬 Family Video Portal</h1>

<hr>

<h2>👨‍👩‍👧 Family Videos</h2>

<button onclick="showLogin('family')">
Enter Family Videos
</button>

<hr>

<h2>👶 Kids Videos</h2>

<button onclick="showLogin('kids')">
Enter Kids Videos
</button>

<hr>

<h2>✈️ Travel Videos</h2>

<button onclick="showLogin('travel')">
Enter Travel Videos
</button>

<hr>

<h2>🎁 Sharing Videos</h2>

<button onclick="showLogin('sharing')">
Enter Sharing Videos
</button>

<div
    id="loginBox"
    style="
        display:none;
        position:fixed;
        top:30%;
        left:40%;
        background:white;
        border:1px solid gray;
        padding:20px;
        z-index:1000;
    "
>

<form
    action="/login"
    method="post"
>

    <input
        type="hidden"
        id="category"
        name="category"
    >

    <p>
        Username
        <br>

        <input
            type="text"
            name="username"
        >
    </p>

    <p>
        Password
        <br>

        <input
            type="password"
            name="password"
        >
    </p>

    <button type="submit">
        Login
    </button>

    <button
        type="button"
        onclick="closeLogin()"
    >
        Cancel
    </button>

</form>

</div>

<script>

function showLogin(category){

    document.getElementById(
        "category"
    ).value = category;

    document.getElementById(
        "loginBox"
    ).style.display = "block";
}

function closeLogin(){

    document.getElementById(
        "loginBox"
    ).style.display = "none";
}

</script>

{% endblock %}
