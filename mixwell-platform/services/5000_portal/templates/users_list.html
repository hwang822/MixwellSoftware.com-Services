<table border="1">

<tr>
<th>User</th>
<th>Service Count</th>
<th>Add Service</th>
<th>Remove Service</th>
<th>Action</th>
</tr>

{% for u in users %}

<tr>

<td>{{u.email}}</td>

<td>{{u.service_count}}</td>

<td>
<form hx-post="/user/{{u.id}}/add_service" hx-swap="none">

<select name="service_id">

{% for s in services %}
<option value="{{s.id}}">{{s.name}}</option>
{% endfor %}

</select>

<button>Add</button>

</form>
</td>


<td>
<form hx-post="/user/{{u.id}}/remove_service" hx-swap="none">

<select name="service_id">

{% for s in services %}
<option value="{{s.id}}">{{s.name}}</option>
{% endfor %}

</select>

<button>Remove</button>

</form>
</td>


<td>

<button
hx-delete="/user/{{u.id}}"
hx-confirm="Delete user?"
hx-swap="none">
Delete
</button>

</td>

</tr>

{% endfor %}

</table>
