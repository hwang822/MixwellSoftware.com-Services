{% extends "servicebase.html" %}
{% block content %}

<style>
button {
    margin: 5px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    cursor: pointer;
}

button:hover {
    background-color: #eee;
}
</style>

<h2>📊 Trading Dashboard</h2>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!--================= Day Prices ================= -->
<h3>📈 Day Prices</h3>
<canvas id="dayChart"></canvas>
<table border="1" id="dayTable"></table>
<button onclick="loadDayPrices()">Symbols Day Prices</button>
<hr>

<!-- ================= Daily Prices ================= -->
<h3>📉 Daily Prices</h3>
<canvas id="dailyChart"></canvas>
<table border="1" id="dailyTable"></table>
<button onclick="loadAllDailyPrices()">Symbols Daily Prices</button>
<hr>

<!-- ================= Positions ================= -->
<h3>💼 Positions</h3>
<canvas id="positionsChart" width="400" height="200"></canvas>
<table border="1" id="positionsTable"></table>
<button onclick="loadPositions()">Symbols Position</button>
<hr>

<!-- ================= Trades ================= -->
<h3>📊 Trades</h3>
<canvas id="pnlChart"></canvas>
<table border="1" id="tradeTable"></table>
<button onclick="loadTrades()">Symbols Activities</button>
<hr>

<!-- ================= Scan ================= -->
<h3>🔥Scan Symbols</h3>
<table border="1" id="scanTable"></table>
<button onclick="scan_symbols()">Scan Symbols</button>
</b>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let dayChart;
async function loadDayPrices() {
    const res = await fetch("/api/day_prices");
    const data = await res.json();

    if (dayChart) dayChart.destroy();

    const datasets = Object.keys(data).map(symbol => ({
        label: symbol,
        data: data[symbol].prices
    }));

    const labels = data[Object.keys(data)[0]].labels;

    dayChart = new Chart(document.getElementById("dayChart"), {
        type: "line",
        data: { labels, datasets }
    });
    // ---- Table ----
    let html = "<tr><th>Symbol</th><th>Price</th><th>Vw</th><th>Time</th></tr>";
    
    Object.keys(data).forEach(symbol => {
        const labels = data[symbol].labels;
        const prices = data[symbol].prices;

        for (let i = 0; i < labels.length; i++) {
            html += `<tr>
                <td>${symbol}</td>
                <td>${labels[i]}</td>
                <td>${prices[i].toFixed(2)}</td>
            </tr>`;
        }
    });

    document.getElementById("dayTable").innerHTML = html;


}
</script>

<script>
let dailyChart = null;

async function loadAllDailyPrices() {
    const res = await fetch("/api/daily_prices");
    const data = await res.json();

    if (dailyChart) dailyChart.destroy();

    const datasets = Object.keys(data).map(symbol => ({
        label: symbol,
        data: data[symbol].prices
    }));

    const labels = data[Object.keys(data)[0]].labels;

    dailyChart = new Chart(document.getElementById("dailyChart"), {
        type: "line",
        data: { labels, datasets }
    });


    // ---- Table ----
    let html = "<tr><th>Symbol</th><th>Qty</th><th>Price</th><th>Time</th></tr>";
    Object.keys(data).forEach(symbol => {
        const labels = data[symbol].labels;
        const prices = data[symbol].prices;

        for (let i = 0; i < labels.length; i++) {
            html += `<tr>
                <td>${symbol}</td>
                <td>${labels[i]}</td>
                <td>${prices[i].toFixed(2)}</td>
            </tr>`;
        }
    });

    document.getElementById("dailyTable").innerHTML = html;

}
</script>


<script>
let positionsChart = null;

async function loadPositions() {
    const res = await fetch("/api/positions");
    const data = await res.json();

    // ---- Table ----
    let html = "<tr><th>Symbol</th><th>Qty</th><th>Price</th><th>Time</th></tr>";
    data.forEach(p => {
        html += `<tr>
            <td>${p.symbol}</td>
            <td>${p.qty}</td>
            <td>${p.price.toFixed(2)}</td>
            <td>${p.time}</td>
        </tr>`;
    });
    document.getElementById("positionsTable").innerHTML = html;

    // ---- Chart ----
    const labels = data.map(p => p.symbol);
    const qtys = data.map(p => p.qty);

    // 如果 chart 已存在，先 destroy 再重建
    if (positionsChart) positionsChart.destroy();

    const ctx = document.getElementById('positionsChart').getContext('2d');
    positionsChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Quantity',
                data: qtys,
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
}

</script>


<script>

let pnlChart = null;
async function loadTrades() {
    const res = await fetch("/api/trades");
    const data = await res.json();

    if (pnlChart) pnlChart.destroy();


// ===== PnL Chart =====
    if (pnlChart) pnlChart.destroy();

    let pnl = 0;
    const pnlData = [];
    const labels = [];

    // 👉 按时间顺序（从旧到新）
    const sorted = data.slice().reverse();

    sorted.forEach(t => {
        let value = t.price * t.qty;

        if (t.side === "BUY") pnl -= value;
        if (t.side === "SELL") pnl += value;

        pnlData.push(pnl);
        labels.push(t.time);
    });

    const ctx = document.getElementById("pnlChart").getContext("2d");

    pnlChart = new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "PnL",
                data: pnlData,
                borderColor: pnl >= 0 ? "green" : "red",
                fill: false
            }]
        }
    });

    // ---- Table ----
    let html = "<tr><th>Symbol</th><th>Side</th><th>Price</th><th>Qty</th><th>Time</th></tr>";
    data.forEach(p => {
        html += `<tr>
            <td>${p.symbol}</td>
            <td>${p.side}</td>
            <td>${p.price.toFixed(2)}</td>
            <td>${p.qty}</td>
            <td>${p.time}</td>
        </tr>`;
    });
    document.getElementById("tradeTable").innerHTML = html;
}
</script>

<script>
let currentSection = "day";

function showSection(type) {
    currentSection = type;

    document.getElementById("section-day").style.display = "none";
    document.getElementById("section-daily").style.display = "none";
    document.getElementById("section-positions").style.display = "none";

    document.getElementById("section-" + type).style.display = "block";

    refreshCurrent();
}

function refreshCurrent() {
    if (currentSection === "day") loadAllDayPrices();
    //if (currentSection === "daily") loadAllDailyPrices();
    if (currentSection === "positions") loadPositions();
}

'setInterval(refreshCurrent, 30000);'
</script>

<script>
function showSection(type) {
    document.getElementById("section-day").style.display = "none";
    document.getElementById("section-daily").style.display = "none";
    document.getElementById("section-positions").style.display = "none";

    document.getElementById("section-" + type).style.display = "block";

    // 切换时加载数据
    if (type === "day") loadAllDayPrices();
    //if (type === "daily") loadAllDailyPrices();
    if (type === "positions") loadPositions();
}
</script>

<script>

async function scan_symbols() {
    const res = await fetch("/api/scansymbols");
    const data = await res.json();

    let html = "<tr><th>Symbol</th><th>Score</th><th>Price</th><th>Volume</th><th>Time</th></tr>";

    data.forEach(p => {
        html += `<tr>
            <td>${p.symbol}</td>
            <td>${p.score}</td>
            <td>${p.price}</td>
            <td>${p.volume}</td>
            <td>${p.timestamp}</td>
        </tr>`;
    });
    document.getElementById("scanTable").innerHTML = html;


}
</script>

{% endblock %}
