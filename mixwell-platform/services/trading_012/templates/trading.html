<!DOCTYPE html>
<html>
<head>
<title>Trading Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

<style>
    body { font-family: Arial; }
    table {
        border-collapse: collapse;   /* 很重要，避免双线 */
    }

    td, th {
        border: 1px solid black;     /* ✅ 黑色边框 */
        padding: 5px;
    }

    th {
        background-color: #ccc;      /* 灰色背景 */
        color: black;
    }</style>
</head>

<body>

    <h2>Trading Dashboard</h2>

    <div id="table_container"></div>    

    <h3>Today Prices</h3>
    <div id="day_prices_lineChart" style="width:100%;height:400px;"></div>    
    <table id="day_prices_table" border="1"></table>

    <h3>Month Prices</h3>
    <div id="daily_prices_lineChart" style="width:100%;height:400px;"></div>    
    <table id="daily_prices_table" border="1"></table>

    <h3>Positions</h3>
    <div id="positions_barChart" style="width:100%;height:400px;"></div>
    <table id="positions_table" border="1"></table>

    <h3>Trades</h3>
    <div id="trades_barChart" style="width:100%;height:400px;"></div>    
    <table id="trades_table" border="1"></table>

    <h3>Top Symbols</h3>
    <div id="top_symbols_barChart" style="width:100%;height:400px;"></div>    
    <table id="top_symbols_table" border="1"></table>

    <h3>Account</h3>
    <table id="account_table" border="1"></table>

    
    <script>

        function toggleRow(i) {

            const rows = document.querySelectorAll(".child_" + i);
            const btn = document.getElementById("btn_" + i);

            let isHidden = rows[0].style.display === "none";

            rows.forEach(r => {
                r.style.display = isHidden ? "table-row" : "none";
            });

            btn.innerText = isHidden ? "[-]" : "[+]";
        }

        async function load(url, id){
            const res = await fetch(url);
            const html = await res.text();
            console.log(" url: ", url)
            //console.log(" table html: ", html)
            //console.log(" ", html)
            document.getElementById(id).innerHTML = html;

        }

        function refreshAlltables(){
            load("/api/table/day_prices","day_prices_table");
            load("/api/table/daily_prices","daily_prices_table");
            load("/api/table/positions","positions_table");
            load("/api/table/trades","trades_table");
            load("/api/table/top_symbols","top_symbols_table");
            load("/api/table/account","account_table");
        }        


    //setInterval(refreshAll, 300000);
    refreshAlltables();


    let barChart = echarts.init(document.getElementById('positions_barChart'));
    let daypricelineChart = echarts.init(document.getElementById('day_prices_lineChart'));
    let dailypricelineChart = echarts.init(document.getElementById('daily_prices_lineChart'));

    // ==============================
    // 加载 Chart（交易触发）
    // ==============================
    async function loadChart() {
        const res = await fetch('/api/chart');
        const data = await res.json();        
        renderLine(data.line)
        renderBar(data.bar)
    }

    async function loadBarChart() {
        const res = await fetch('/api/barchart');
        const bar = await res.json();
        renderBar(bar);
    }

    async function loadLineChart() {
        const res = await fetch('/api/linechart');
        const data = await res.json();
        renderLine(data);
    }



    // ==============================
    // 5分钟刷新价格
    // ==============================
    async function refreshDayPrices() {
        const res = await fetch('/api/day_prices');
        const data = await res.json();
        renderLine(data)         
    }

    async function refreshDailyPrices() {
        const res = await fetch('/api/daily_prices');
        const data = await res.json(); 
        renderLine(data);
    }

    // 👉 每5分钟
    //setInterval(refreshPrices, 5 * 60 * 1000);


    // ==============================
    // BAR CHART
    // ==============================
    function renderBar1(data) {

        let series = [];

        data.forEach(sym => {

            series.push({
                name: sym.symbol,
                type: 'bar',
                data: sym.bars.map(p => p.price),

                markLine: {
                    symbol: 'none',
                    lineStyle: { width: 3 },
                    data: [
                        { yAxis: sym.cost_line }
                    ]
                }
            });
        });

        barChart.setOption({
            tooltip: {
                trigger: 'axis'
            },
            xAxis: {
                type: 'category',
                data: data[0].bars.map(p => p.time)
            },
            yAxis: { type: 'value' },
            series: series
        });
    }


    // ==============================
    // LINE CHART
    // ==============================
    function renderLine1(data) {

        let series = [];
        data.forEach(sym => {
            series.push({
                name: sym.symbol,
                type: 'line',
                data: sym.line.map(p => p.price),

                markPoint: {
                    data: sym.markers.map(m => ({
                        coord: [m.time, m.price],
                        value: m.action,
                        tooltip: {
                            formatter: `${m.action}<br/>${m.reason}`
                        }
                    }))
                }
            });
        });

        daypricelineChart.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: {
                type: 'category',
                data: data[0].line.map(p => p.time)
            },
            yAxis: { type: 'value' },
            series: series
        });
    }


    // ==============================
    // 模拟交易
    // ==============================
    async function triggerTrade() {
        //await fetch('/api/trade');
        //await loadChart(); // 👉 只有交易才刷新
    }


    // 初始化    
    //loadtable();
    loadBarChart()
    loadLineChart()    
    //refreshDailyPrices()


    function renderLine(data) {

        let series = [];

        data.forEach(sym => {

            series.push({
                name: sym.symbol,
                type: 'line',
                data: sym.series.map(p => p.y)
            });
        });

        daypricelineChart.setOption({
            xAxis: {
                data: data[0].series.map(p => p.x)
            },
            yAxis: { type: 'value' },
            series: series
        });
    }

function renderBar(data) {
    //console.log(data)
    const symbols = data.map(d => d.x);
    const values = data.map(d => d.y);
    //console.log(symbols)
    //console.log(values)
    barChart.setOption({

        tooltip: {
            formatter: (p) => {
                return `
                    ${p.name}<br/>
                    Change: ${(p.value * 100).toFixed(2)}%
                `;
            }
        },

        xAxis: {
            type: 'category',
            data: symbols   // ✅ symbol 做 x轴
        },

        yAxis: {
            type: 'value',
            axisLabel: {
                formatter: (v) => (v * 100).toFixed(2) + "%"
            }
        },

        series: [{
            type: 'bar',
            data: values,

            itemStyle: {
                color: (params) => {
                    return params.value >= 0 ? "#00FF99" : "#FF3366";
                }
            },

            // ✅ 参考线（成本 / 0线）
            markLine: {
                data: [
                    { yAxis: 0 }
                ],
                lineStyle: {
                    width: 2
                }
            }
        }]
    });
}
</script>


</body>
</html>
