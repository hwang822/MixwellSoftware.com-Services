    2️⃣ 前端图表自动刷新
    <script>
    let chartDay = null;
    let chartDaily = null;
    function getTradeMap(trades) {
        const tradeMap = {};
        trades.forEach(t => {
            tradeMap[t.index] = t;
        });
    }


    async function fetchDayPrices() {
        const res = await fetch("/api/day_prices");        
        return await res.json();
    }

    async function fetchDailyPrices() {
        const res = await fetch("/api/daily_prices");
        //location.reload();
        return await res.json();
    }

    async function updateDayPrices() {
        return await drawRealtimeChart(false);
    }

    async function updateDailyPrices() {
        return await drawRealtimeChart(true);
    }

    async function drawRealtimeChart(daily) {
        const data = daily ? await fetchDailyPrices() : await fetchDayPrices();

        if (!data || !data.length) return;

        const ctx = daily
            ? document.getElementById('chartDaily').getContext('2d')
            : document.getElementById('chartDay').getContext('2d');        

        let globalMax = 0;

        // 计算最大波动
        data.forEach(d => {
            const base = d.prices[0];
            const pct = d.prices.map(p => (p - base) / base * 100);
            const max = Math.max(...pct.map(v => Math.abs(v)));
            if (max > globalMax) globalMax = max;
        });

        globalMax = Math.ceil(globalMax * 1.2);

        const datasets = data.map(d => ({
            label: d.symbol,
            data: d.prices.map(p => (p - d.prices[0]) / d.prices[0] * 100),
            borderColor: d.color || "gray",
            fill: false,
            tension: 0.2
        }));

        const labels = data[0]?.dates || [];

        // 👉 选择对应 chart
        let chart = daily ? chartDaily : chartDay;

        // ✅ 如果不存在 → 创建
        if (!chart) {
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    animation: false,
                    responsive: true,
                    scales: {
                        y: {
                            min: -globalMax,
                            max: globalMax,
                            ticks: {
                                callback: v => v + "%"
                            }
                        }
                    }
                }
            });

            if (daily) chartDaily = chart;
            else chartDay = chart;

        } else {
            // ✅ 更新（关键）
            chart.data.labels = labels;
            chart.data.datasets = datasets;

            chart.options.scales.y.min = -globalMax;
            chart.options.scales.y.max = globalMax;

            chart.update("none");
        }
    }
    // timer setup

    const TRADE_WINDOWS = [
        { start: [9, 30], end: [11, 30] },   // 9:30 AM - 11:30 AM
        { start: [13, 0], end: [15, 0] }     // 1:00 PM - 3:00 PM
    ];
    
//    ✅ 自动交易触发
    function getNYTime() {
        return new Date(
            new Date().toLocaleString("en-US", { timeZone: "America/New_York" })
        );
    }

    function isBestTradeTime() {
        const now = getNYTime();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        return TRADE_WINDOWS.some(w => {
            const start = w.start[0] * 60 + w.start[1];
            const end   = w.end[0] * 60 + w.end[1];
            return currentMinutes >= start && currentMinutes <= end;
        });
    }
    function isDailytUpdateTime() {
        const now = getNYTime();
        const total = now.getHours() * 60 + now.getMinutes();
        // 示例：9:00 - 9:07
        return total >= (9*60+35) && total <= (10*60+30);
    }

    let tradingRunning = false;
    let updatedFlag = false;

    async function fetchData() {
        updateTradeTime()

        // 5分钟刷新图表
        await updateDayPrices();

        // === 自动交易窗口 ===
        if (isBestTradeTime() && !tradingRunning) {
            tradingRunning = true;
            try {
                await runTrade();
            } finally {
                tradingRunning = false;
            }
        }

        // === 每日更新窗口 ===
        if (isDailytUpdateTime() && !updatedFlag) {
            updatedFlag = true;
            await updateScan();
            await updateTrade();
            await updatePositions();
            await updateDailyPrices();
        }

        // 重置每日更新标志（窗口结束后）
        if (!isDailytUpdateTime() && updatedFlag) {
            updatedFlag = false;
        }
    }

    // 页面加载立即刷新一次
    fetchData();
    updateDayPrices();
    updateDailyPrices();

    // 5分钟循环刷新
    setInterval(fetchData, 5 * 60 * 1000);

</script>
